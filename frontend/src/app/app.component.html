<div style="padding: 20px">
  <h2>Plaid Test</h2>

  <button (click)="createLinkToken()">Connect Bank Account</button>

  <h3>Transactions</h3>

  <div *ngIf="transactions.length === 0">No transactions loaded yet.</div>

  <ul *ngIf="transactions.length > 0">
    <li *ngFor="let t of transactions">
      <strong>{{ t.name }}</strong> — {{ t.amount }} — {{ t.date }}
    </li>
  </ul>
</div>
